<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenTab</title>
    <link rel="stylesheet" href="newtab.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-overlay"></div>

    <div class="theme-toggle-container">
        <button id="settings-toggle" class="btn-icon" title="Settings"
            style="background: rgba(0,0,0,0.2); width: 30px; height: 30px; border-radius: 50%; font-size: 1.2rem; display: flex; align-items: center; justify-content: center;">⚙️</button>
        <input type="checkbox" id="theme-checkbox">
        <label for="theme-checkbox" class="theme-toggle-label">
            <span class="toggle-icon sun-icon">☀️</span>
            <span class="toggle-icon moon-icon">🌙</span>
        </label>
    </div>

    <button id="sidebar-toggle" class="sidebar-toggle" title="Open Tabs">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>Open Tabs</h3>
            <button id="refresh-tabs" class="btn-icon" title="Refresh Tabs">🔄</button>
        </div>
        <div id="tabs-list" class="tabs-list">
            <!-- Tabs will be rendered here -->
        </div>
    </aside>

    <main class="dashboard" id="main-content">
        <div class="search-container" style="display: flex; gap: 10px; align-items: center; justify-content: center;">
            <input type="text" id="search-input" placeholder="Search Google or type to filter links..."
                autocomplete="off">
            <button id="add-section-btn" class="btn btn-primary" style="white-space: nowrap;">+ Section</button>
        </div>

        <header class="header">
            <h1 class="time" id="clock">00:00</h1>
            <p class="greeting" id="greeting">Good afternoon</p>
        </header>

        <section id="sections-container" class="sections-grid">
            <!-- Sections will be rendered here -->
        </section>

        <div class="actions">
            <!-- Export/Import moved to settings -->
            <input type="file" id="import-input" style="display: none;" accept=".json">
        </div>
    </main>

    <!-- Modals -->
    <div id="section-modal" class="modal">
        <div class="modal-content">
            <h2 id="section-modal-title">New Section</h2>
            <input type="text" id="section-name" placeholder="Section Name">
            <div class="icon-picker-container">
                <p>Select Icon:</p>
                <div id="icon-picker" class="icon-picker">
                    <!-- Icons will be injected here -->
                </div>
                <input type="hidden" id="section-icon" value="">
            </div>
            <input type="hidden" id="section-id-edit" value="">
            <div class="modal-actions">
                <button id="cancel-section-btn" class="btn btn-secondary">Cancel</button>
                <button id="save-section-btn" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <div id="link-modal" class="modal">
        <div class="modal-content">
            <h2>Add Link</h2>
            <input type="text" id="link-name" placeholder="Name">
            <input type="url" id="link-url" placeholder="URL (https://)">
            <input type="hidden" id="link-section-id">
            <div class="modal-actions">
                <button id="cancel-link-btn" class="btn btn-secondary">Cancel</button>
                <button id="save-link-btn" class="btn btn-primary">Add Link</button>
            </div>

        </div>
    </div>

    <div id="tab-picker-modal" class="modal">
        <div class="modal-content">
            <h2>Add Tab to Section</h2>
            <div class="picker-group">
                <label for="existing-section-select">Add to existing:</label>
                <select id="existing-section-select" class="picker-select">
                    <option value="">-- Select Section --</option>
                </select>
            </div>
            <div class="picker-divider">
                <span>OR</span>
            </div>
            <div class="picker-group">
                <label for="new-section-name">Add to new section:</label>
                <input type="text" id="new-section-name" placeholder="New Section Name">
            </div>
            <input type="hidden" id="tab-to-add-url">
            <input type="hidden" id="tab-to-add-title">
            <div class="modal-actions">
                <button id="cancel-tab-picker-btn" class="btn btn-secondary">Cancel</button>
                <button id="save-tab-picker-btn" class="btn btn-primary">Add Tab</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">Settings</h2>
                <button id="close-settings-btn" class="btn-icon" style="font-size: 1.5rem;">&times;</button>
            </div>

            <div class="settings-section">
                <h3 style="font-size: 1rem; margin-bottom: 10px; opacity: 0.8;">Customization</h3>
                <div class="picker-group">
                    <label style="margin-bottom: 5px; display: block;">Custom Background Image</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="file" id="bg-upload" accept="image/*" style="flex: 1;">
                        <button id="reset-bg-btn" class="btn btn-secondary" title="Reset to default gradient">↺</button>
                    </div>
                    <p style="font-size: 0.75rem; opacity: 0.5; margin-top: 5px;">Supported: JPG, PNG. Max 5MB
                        recommended.</p>
                </div>
            </div>

            <div class="settings-section">
                <h3 style="font-size: 1rem; margin-bottom: 10px; opacity: 0.8; margin-top: 10px;">Data Management</h3>
                <div class="picker-group" style="flex-direction: row; gap: 10px;">
                    <button id="export-btn" class="btn btn-secondary" style="flex: 1;">Export Backup</button>
                    <button id="import-btn" class="btn btn-secondary" style="flex: 1;">Import Backup</button>
                </div>
            </div>

            <div class="settings-section">
                <h3 style="font-size: 1rem; margin-bottom: 10px; opacity: 0.8; margin-top: 10px;">Testing</h3>
                <div class="picker-group"
                    style="flex-direction: row; justify-content: space-between; align-items: center;">
                    <label for="toast-test-btn" style="font-size: 0.9rem;">Test Notification</label>
                    <button id="toast-test-btn" class="btn btn-secondary"
                        style="padding: 5px 10px; font-size: 0.8rem;">Test</button>
                </div>
            </div>
        </div>
    </div>

    <div id="confirm-modal" class="modal">
        <div class="modal-content" style="max-width: 350px; text-align: center;">
            <h2 style="margin-bottom: 10px;">Are you sure?</h2>
            <p id="confirm-message" style="margin-bottom: 20px; opacity: 0.8;">This action cannot be undone.</p>
            <div class="modal-actions" style="justify-content: center;">
                <button id="confirm-cancel-btn" class="btn btn-secondary">Cancel</button>
                <button id="confirm-yes-btn" class="btn btn-primary" style="background: #ff4d4d;">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="newtab.js"></script>
</body>

</html>
